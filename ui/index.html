<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-src https://app.edubase.ch"
    />
    <title>Stapel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-left">
        <button class="back" id="backBtn" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" /></svg>
          <span data-t="back"></span>
        </button>
        <div class="bar-title" id="barTitle">Stapel</div>
      </div>
      <div class="bar-actions">
        <button class="chip" id="folderBtn" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.6l1.4 1.5h6a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" /></svg>
          <span id="folderName"></span>
        </button>
        <button class="chip ghost" id="logoutBtn" data-t="signOut" hidden></button>
        <button class="btn primary small" id="pdfBtn" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M4.5 7.5L8 11l3.5-3.5M3 13.5h10" /></svg>
          <span data-t="savePdf"></span>
        </button>
        <div class="lang" id="langSwitch" role="radiogroup" aria-label="Language">
          <button data-lang="en">EN</button><button data-lang="de">DE</button>
        </div>
      </div>
    </header>

    <!-- 1 · connecting -->
    <main class="screen" id="boot">
      <div class="center">
        <div class="spinner" aria-hidden="true"></div>
        <p class="muted" id="bootText"></p>
        <button class="btn secondary" id="retryBtn" data-t="retry" hidden></button>
      </div>
    </main>

    <!-- 2 · signed out -->
    <main class="screen" id="welcome" hidden>
      <div class="welcome">
        <div class="stack" aria-hidden="true">
          <span class="book b1"></span><span class="book b2"></span><span class="book b3"></span>
        </div>
        <h1 data-t-html="welcomeTitle"></h1>
        <p class="lead" data-t="welcomeLead"></p>
        <button class="btn primary big" id="loginBtn" data-t="signIn"></button>
        <p class="fine" data-t="welcomeFine"></p>
        <button class="link" id="guestBtn" data-t="guest"></button>
        <p class="fine foot" data-t="notAffiliated"></p>
      </div>
    </main>

    <!-- 3 · library -->
    <main class="screen" id="library" hidden>
      <div class="lib-head">
        <div>
          <h2 data-t="library"></h2>
          <p class="muted" id="libCount"></p>
        </div>
        <div class="lib-tools">
          <input type="search" id="search" data-t-placeholder="search" autocomplete="off" spellcheck="false" />
          <button class="icon-btn" id="reloadBtn" data-t-title="reload">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" /></svg>
          </button>
        </div>
      </div>
      <div class="guest-note" id="guestNote" hidden>
        <span data-t="guestNote"></span>
        <button class="link" id="guestLoginBtn" data-t="signInShort"></button>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty muted" id="empty" data-t="noBooks" hidden></p>
      <p class="paste-hint" data-t="pasteHint"></p>
    </main>

    <!-- 4 · reader: edubase's own reader, signed in with the app's session -->
    <main class="screen reader" id="reader" hidden>
      <webview id="view" partition="persist:edubase" src="about:blank"></webview>
    </main>

    <!-- PDF sheet -->
    <div class="scrim" id="scrim" hidden></div>
    <aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
      <button class="close" id="closeSheet" data-t-title="close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
      </button>

      <div class="sheet-cover">
        <img id="sheetCover" alt="" />
        <img id="sheetPreview" class="preview" alt="" />
        <div class="done-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9" /></svg>
        </div>
      </div>

      <h3 id="sheetTitle"></h3>

      <section id="stateIdle">
        <div class="seg" role="radiogroup">
          <button class="on" data-range="all" data-t="wholeBook"></button>
          <button data-range="part" data-t="somePages"></button>
        </div>
        <div class="range" id="rangeFields" hidden>
          <label><span data-t="from"></span> <input type="number" id="fromPage" min="1" value="1" /></label>
          <label><span data-t="to"></span> <input type="number" id="toPage" min="1" data-t-placeholder="end" /></label>
        </div>
        <button class="btn primary wide" id="startBtn" data-t="saveButton"></button>
        <p class="fine center-text" id="saveWhere"></p>
        <p class="fine center-text" data-t="licenceNote"></p>
      </section>

      <section id="stateRun" hidden>
        <div class="progress"><div class="fill" id="fill"></div></div>
        <div class="run-line">
          <span id="runText"></span>
          <span class="muted" id="runEta"></span>
        </div>
        <button class="btn secondary wide" id="cancelBtn" data-t="cancel"></button>
      </section>

      <section id="stateDone" hidden>
        <p class="done-text" id="doneText"></p>
        <button class="btn primary wide" id="openBtn" data-t="openPdf"></button>
        <button class="btn secondary wide" id="revealBtn" data-t="reveal"></button>
      </section>

      <section id="stateFail" hidden>
        <p class="fail-text" id="failText"></p>
        <button class="btn primary wide" id="againBtn" data-t="retry"></button>
      </section>
    </aside>

    <div class="toast" id="toast" hidden></div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
