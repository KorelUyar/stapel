<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Edubase Downloader</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        height: 100vh;
        overflow: hidden;
      }

      .titlebar {
        -webkit-app-region: drag;
        height: 40px;
        background: linear-gradient(135deg, #1e40af, #3b82f6);
        display: flex;
        align-items: center;
        padding-left: 80px;
      }

      .titlebar-title {
        -webkit-app-region: no-drag;
        color: white;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }

      .content {
        height: calc(100vh - 40px);
        overflow-y: auto;
        padding: 20px;
      }

      .app-header {
        text-align: center;
        margin-bottom: 20px;
      }

      .app-header h1 {
        font-size: 20px;
        font-weight: 700;
        color: #1e40af;
      }

      .app-header p {
        font-size: 13px;
        color: #64748b;
        margin-top: 3px;
      }

      .card {
        background: white;
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 14px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
        border: 1px solid #e2e8f0;
      }

      .card-title {
        font-size: 11px;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 14px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .full {
        grid-column: 1 / -1;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      label {
        font-size: 13px;
        font-weight: 500;
        color: #374151;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"] {
        padding: 9px 12px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-size: 13px;
        color: #1e293b;
        background: #f8fafc;
        outline: none;
        transition:
          border-color 0.15s,
          background 0.15s;
        width: 100%;
      }

      input:focus {
        border-color: #3b82f6;
        background: white;
      }

      .hint {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 2px;
      }

      .dir-row {
        display: flex;
        gap: 8px;
      }
      .dir-row input {
        flex: 1;
      }

      .btn-pick {
        padding: 9px 14px;
        background: #f1f5f9;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #374151;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-pick:hover {
        background: #e2e8f0;
      }

      .btn-download {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.1s;
        margin-bottom: 14px;
        letter-spacing: 0.3px;
      }
      .btn-download:hover:not(:disabled) {
        opacity: 0.92;
      }
      .btn-download:active:not(:disabled) {
        transform: scale(0.99);
      }
      .btn-download:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }

      /* Progress */
      .progress-card {
        display: none;
      }
      .progress-card.show {
        display: block;
      }

      .prog-bar-bg {
        background: #e2e8f0;
        border-radius: 999px;
        height: 7px;
        overflow: hidden;
        margin: 10px 0 8px;
      }

      .prog-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #60a5fa, #2563eb);
        border-radius: 999px;
        transition: width 0.4s ease;
        width: 0%;
      }

      .prog-label {
        font-size: 13px;
        color: #475569;
        font-weight: 500;
      }

      .log-box {
        margin-top: 12px;
        background: #0f172a;
        border-radius: 10px;
        padding: 12px 14px;
        height: 120px;
        overflow-y: auto;
        font-family: "SF Mono", "Fira Code", "Menlo", monospace;
        font-size: 11.5px;
        line-height: 1.7;
      }

      .log-line {
        color: #7dd3fc;
      }
      .log-line.ok {
        color: #4ade80;
      }
      .log-line.err {
        color: #f87171;
      }

      .btn-open {
        display: none;
        margin-top: 12px;
        width: 100%;
        padding: 10px;
        background: #f0fdf4;
        border: 1.5px solid #86efac;
        border-radius: 9px;
        color: #16a34a;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-open:hover {
        background: #dcfce7;
      }
      .btn-open.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <span class="titlebar-title">📚 Edubase Downloader</span>
    </div>

    <div class="content">
      <div class="app-header">
        <h1>Edubase Downloader</h1>
        <p>Bücher als PDF herunterladen und speichern</p>
      </div>

      <!-- Zugangsdaten -->
      <div class="card">
        <div class="card-title">Zugangsdaten</div>
        <div class="grid-2">
          <div class="field">
            <label>E-Mail</label>
            <input type="email" id="email" placeholder="deine@email.ch" />
          </div>
          <div class="field">
            <label>Passwort</label>
            <input type="password" id="password" placeholder="••••••••" />
          </div>
        </div>
      </div>

      <!-- Buch -->
      <div class="card">
        <div class="card-title">Buch</div>
        <div class="grid-2">
          <div class="field full">
            <label>Edubase URL</label>
            <input
              type="text"
              id="bookUrl"
              placeholder="https://app.edubase.ch/#doc/61797/1"
              oninput="parseUrl(this.value)"
            />
            <span class="hint"
              >URL einfügen – Buch-ID wird automatisch erkannt</span
            >
          </div>
          <div class="field">
            <label>Buch-ID</label>
            <input type="text" id="bookId" placeholder="61797" />
          </div>
          <div class="field"></div>
          <div class="field">
            <label>Startseite</label>
            <input type="number" id="startPage" value="1" min="1" />
          </div>
          <div class="field">
            <label>Endseite</label>
            <input type="number" id="endPage" placeholder="351" min="1" />
          </div>
        </div>
      </div>

      <!-- Ausgabe -->
      <div class="card">
        <div class="card-title">Ausgabe</div>
        <div class="grid-2">
          <div class="field full">
            <label>Dateiname (ohne .pdf)</label>
            <input type="text" id="outputName" placeholder="Mathe Band 1" />
          </div>
          <div class="field full">
            <label>Speicherort</label>
            <div class="dir-row">
              <input
                type="text"
                id="outputDir"
                placeholder="~/Downloads"
                readonly
              />
              <button class="btn-pick" onclick="chooseDir()">📁 Wählen</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Button -->
      <button class="btn-download" id="dlBtn" onclick="startDownload()">
        ⬇ Download starten
      </button>

      <!-- Progress -->
      <div class="card progress-card" id="progressCard">
        <div class="card-title">Fortschritt</div>
        <div class="prog-label" id="progLabel">Wird vorbereitet...</div>
        <div class="prog-bar-bg">
          <div class="prog-bar-fill" id="progBar"></div>
        </div>
        <div class="log-box" id="logBox"></div>
        <button class="btn-open" id="openBtn" onclick="openOutputFolder()">
          📂 Ordner im Finder öffnen
        </button>
      </div>
    </div>

    <script>
      let lastOutputDir = null;

      // Buch-ID (und ggf. Startseite) aus der eingefügten Edubase-URL lesen
      function parseUrl(value) {
        const match = value.match(/#doc\/(\d+)(?:\/(\d+))?/);
        if (!match) return;
        document.getElementById("bookId").value = match[1];
        if (match[2]) document.getElementById("startPage").value = match[2];
      }

      async function chooseDir() {
        const dir = await window.edubase.chooseDirectory();
        if (dir) document.getElementById("outputDir").value = dir;
      }

      function log(msg, type) {
        const box = document.getElementById("logBox");
        const line = document.createElement("div");
        line.className = "log-line" + (type ? " " + type : "");
        line.textContent = msg;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
      }

      function openOutputFolder() {
        if (lastOutputDir) window.edubase.openFolder(lastOutputDir);
      }

      async function startDownload() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const bookId = document.getElementById("bookId").value.trim();
        const startPage = parseInt(document.getElementById("startPage").value, 10);
        const endPage = parseInt(document.getElementById("endPage").value, 10);
        const outputName =
          document.getElementById("outputName").value.trim() || "edubase-buch";
        const outputDir = document.getElementById("outputDir").value.trim();

        if (!email || !password) return alert("Bitte E-Mail und Passwort eingeben.");
        if (!bookId) return alert("Bitte eine gültige Edubase-URL oder Buch-ID eingeben.");
        if (!startPage || !endPage || endPage < startPage)
          return alert("Bitte gültige Start- und Endseite eingeben.");
        if (!outputDir) return alert("Bitte einen Speicherort wählen.");

        const btn = document.getElementById("dlBtn");
        const openBtn = document.getElementById("openBtn");
        btn.disabled = true;
        btn.textContent = "Läuft...";
        openBtn.classList.remove("show");
        document.getElementById("progressCard").classList.add("show");
        document.getElementById("logBox").innerHTML = "";
        document.getElementById("progBar").style.width = "0%";

        const result = await window.edubase.startDownload({
          email,
          password,
          bookId,
          startPage,
          endPage,
          outputName,
          outputDir,
        });

        if (result.success) {
          lastOutputDir = result.dir;
          openBtn.classList.add("show");
          log("✓ Fertig: " + result.path, "ok");
        } else {
          log("Fehler: " + result.error, "err");
        }

        btn.disabled = false;
        btn.textContent = "⬇ Download starten";
      }

      // Fortschritt aus dem Main-Prozess anzeigen
      window.edubase.onProgress(({ msg, current, total }) => {
        document.getElementById("progLabel").textContent = msg;
        if (total > 0) {
          const pct = Math.round((current / total) * 100);
          document.getElementById("progBar").style.width = pct + "%";
        }
        log(msg);
      });

      // Standard-Speicherort auf den Downloads-Ordner setzen
      window.edubase.getDownloadsPath().then((p) => {
        const dir = document.getElementById("outputDir");
        if (!dir.value) dir.value = p;
      });
    </script>
  </body>
</html>
