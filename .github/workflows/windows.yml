name: Windows

# Builds the Windows installer on a real Windows machine and proves it works: the end-to-end
# check (scripts/smoke.js) against the source and against the packaged app, then a silent
# install and a screenshot of the installed app, then an update over the running app. The
# installer is kept as an artifact; the release is made by hand from it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: End-to-end check (source)
        run: npx electron scripts/smoke.js smoke/source

      - name: Build the installer
        run: npx electron-builder --win --publish never

      - name: End-to-end check (packaged app code)
        run: npx electron scripts/smoke.js smoke/packaged dist/win-unpacked/resources/app.asar

      - name: Install silently, start, screenshot
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "resolution unchanged" }
          Start-Process -FilePath dist/Stapel-Windows-Setup.exe -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Stapel\Stapel.exe"
          if (-not (Test-Path $exe)) { throw "Stapel.exe was not installed at $exe" }
          Write-Host "installed:" $exe
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force smoke | Out-Null
          $bmp.Save("smoke/installed-app.png")
          $running = -not $app.HasExited
          Write-Host "installed app still running after 25 s:" $running
          Get-Process Stapel -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $running) { throw "the installed app did not stay open" }

      # The way the app updates itself: the installer of the new version is run over the
      # installed, running app. It has to close the app, install without a question, and
      # start the app again.
      - name: Update over the running app
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Stapel\Stapel.exe"
          $old = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          node -e "require('./update.js').installWindows(require('path').resolve('dist/Stapel-Windows-Setup.exe'))"
          if (-not $old.WaitForExit(120000)) { throw "the running app was not closed by the update" }
          Write-Host "the running app was closed"
          Start-Sleep -Seconds 3
          $deadline = (Get-Date).AddSeconds(150)
          $started = $false
          while ((Get-Date) -lt $deadline -and -not $started) {
            Start-Sleep -Seconds 2
            $started = [bool](Get-Process Stapel -ErrorAction SilentlyContinue)
          }
          if (-not $started) { throw "the app was not started again after the update" }
          Start-Sleep -Seconds 20
          $running = @(Get-Process Stapel -ErrorAction SilentlyContinue)
          Write-Host "Stapel processes 20 s after the update:" $running.Count
          if ($running.Count -eq 0) { throw "the updated app did not stay open" }
          $running | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Stapel-Windows-Setup
          path: dist/Stapel-Windows-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke/
